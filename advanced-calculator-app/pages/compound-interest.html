<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compound Interest Calculator</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;max-width:720px;margin:2rem auto;padding:1rem}
    label{display:block;margin-top:.6rem}
    input{width:100%;padding:.5rem;margin-top:.25rem}
    button{margin-top:1rem;padding:.5rem 1rem}
    #result{margin-top:1rem;font-weight:600}
  </style>
</head>
<body>
  <h1>Compound Interest Calculator</h1>
  <form id="ciForm">
    <label>Principal (P)
      <input type="number" id="principal" required step="0.01" value="1000">
    </label>
    <label>Annual Rate (%)
      <input type="number" id="rate" required step="0.01" value="5">
    </label>
    <label>Times Compounded per Year (n)
      <input type="number" id="times" required step="1" min="1" value="12">
    </label>
    <label>Years (t)
      <input type="number" id="years" required step="0.1" min="0" value="10">
    </label>
    <button type="submit">Calculate</button>
  </form>

  <div id="result" aria-live="polite"></div>

  <script>
    document.getElementById('ciForm').addEventListener('submit', function(e){
      e.preventDefault();
      const P = parseFloat(document.getElementById('principal').value) || 0;
      const r = (parseFloat(document.getElementById('rate').value) || 0) / 100;
      const n = parseFloat(document.getElementById('times').value) || 1;
      const t = parseFloat(document.getElementById('years').value) || 0;
      const A = P * Math.pow(1 + r / n, n * t);
      const interest = A - P;
      document.getElementById('result').textContent = `Future Value: ${A.toFixed(2)} — Interest Earned: ${interest.toFixed(2)}`;
    });
  </script>
</body>
</html>
